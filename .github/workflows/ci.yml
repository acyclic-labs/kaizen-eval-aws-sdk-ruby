name: CI

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  rbs-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ['4.0']

    steps:
      - name: Setup Ruby
        uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Resolve gems
        id: gems
        run: |
          bundle config set --local with 'build rbs'
          bundle config set --local path "$HOME/.bundle-gems"
          bundle lock
          echo "ruby=$(ruby -e 'print RUBY_DESCRIPTION' | sha256sum | cut -c1-16)" >> $GITHUB_OUTPUT

      - name: Cache gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bundle-gems
          key: gems-${{ runner.os }}-${{ steps.gems.outputs.ruby }}-rbs-${{ hashFiles('Gemfile.lock') }}
          restore-keys: gems-${{ runner.os }}-${{ steps.gems.outputs.ruby }}-rbs-

      - name: Install gems
        run: |
          bundle install
          bundle clean

      - name: Install rbs collection
        run: rbs collection install

      - name: Build SDK
        run: bundle exec rake build

      - name: RBS Test
        run: bundle exec rake rbs:test

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Supported ruby versions
        ruby: [2.7, '3.0', 3.1, 3.2, 3.3, 3.4, '4.0', jruby-9.4, jruby-10.0]
        env: [KITCHEN_SINK, CRT]
    steps:
      - name: Setup Ruby
        uses: ruby/setup-ruby@762794c140bbeda0f1224786aa33b4b46783a6c1 # v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup ENV
        run: |
          echo "${{ matrix.env }}=1" >> $GITHUB_ENV

      - name: Resolve gems
        id: gems
        run: |
          bundle config set --local with 'build test'
          bundle config set --local path "$HOME/.bundle-gems"
          bundle lock
          echo "ruby=$(ruby -e 'print RUBY_DESCRIPTION' | sha256sum | cut -c1-16)" >> $GITHUB_OUTPUT

      - name: Cache gems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bundle-gems
          key: gems-${{ runner.os }}-${{ steps.gems.outputs.ruby }}-${{ matrix.env }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: gems-${{ runner.os }}-${{ steps.gems.outputs.ruby }}-${{ matrix.env }}-

      - name: Install gems
        run: |
          bundle install
          bundle clean

      - name: Build SDK
        run: bundle exec rake build

      - name: Test
        env:
          JRUBY_OPTS: -J-Xmx4g
        run: bundle exec rake test:spec
